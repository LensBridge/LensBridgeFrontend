<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/minbar-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Browser chrome (the address bar on mobile, the window frame on some
      desktops) keys off the OS preference rather than the console's own class,
      so these track prefers-color-scheme. Someone who overrides the theme in
      the console against their OS setting gets a mismatched title bar; that is
      the whole cost, and it is not worth a script that rewrites this tag.
    -->
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)" />

    <!--
      Theme boot. This has to be a blocking script in the head: next-themes can
      only apply the class once React has mounted, and by then the browser has
      already painted a light console for every dark-theme user. That flash is
      brief, white, and lands on people who chose dark specifically to avoid it.

      The storage key is next-themes' own (a bare string, not JSON) and must
      agree with THEME_STORAGE_KEY in src/App.jsx. localStorage throws outright
      in a locked-down browser rather than returning null, hence the catch:
      failing to read a preference should cost you the default theme, not the
      whole page.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('minbar-theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>

    <meta name="description" content="Minbar Management Console" />
    <!-- Internal tooling: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three faces, three jobs: Syne for display and the wordmark, Montserrat
      for UI text, IBM Plex Mono for anything you would read out loud. Amiri
      sets Arabic in the weekly quote editor.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Montserrat:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap"
    />
    <title>Minbar Console</title>

    <!--
      Shown only when scripting is off. Styles are inline rather than Tailwind
      classes on purpose: in dev, Vite serves the stylesheet through the JS
      module graph, so with JS disabled no Tailwind rule ever arrives and a
      class-styled banner would render as unstyled text.
    -->
    <noscript>
      <style>
        /* React never mounts, so #root is an empty box that only adds scroll. */
        #root { display: none !important; }

        .noscript-page {
          min-height: 100vh;
          margin: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          box-sizing: border-box;
          background: #1C1210;
          color: #F5E9DC;
          font-family: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          line-height: 1.6;
        }

        .noscript-card {
          max-width: 32rem;
          width: 100%;
          background: #241713;
          border: 1px solid #3A251E;
          border-radius: 16px;
          padding: 32px;
        }

        .noscript-card svg { display: block; margin-bottom: 22px; }

        .noscript-card h1 {
          margin: 0 0 12px;
          font-size: 1.375rem;
          line-height: 1.3;
          font-weight: 600;
          letter-spacing: 0.02em;
        }

        .noscript-card p { margin: 0 0 16px; color: #C4A996; }
        .noscript-card ul { margin: 0 0 16px; padding-left: 20px; color: #C4A996; }
        .noscript-card li { margin-bottom: 6px; }
        .noscript-card strong { color: #F5E9DC; }

        .noscript-card code {
          background: #120B0A;
          border: 1px solid #3A251E;
          border-radius: 5px;
          padding: 1px 5px;
          font-size: 0.875em;
          color: #F5E9DC;
          white-space: nowrap;
        }

        .noscript-footer {
          margin: 20px 0 0;
          padding-top: 16px;
          border-top: 1px solid #3A251E;
          font-size: 0.8125rem;
          color: #9A7D6C;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div class="noscript-page">
        <div class="noscript-card">
          <svg width="44" height="44" viewBox="0 0 100 100">
            <path d="M26 78 V48 A24 24 0 0 1 74 48 V78" fill="none" stroke="#F5E9DC" stroke-width="8" stroke-linecap="round"/>
            <rect x="16" y="84" width="68" height="8" rx="4" fill="#F26430"/>
          </svg>
          <h1>The console needs JavaScript</h1>
          <p>
            Your browser has JavaScript turned off. The Minbar console renders
            entirely in the browser, so nothing below this message will load
            without it.
          </p>
          <p><strong>To turn it back on:</strong></p>
          <ul>
            <li><strong>Firefox</strong> — open <code>about:config</code>, search for
              <code>javascript.enabled</code> and set it to <code>true</code>.</li>
            <li><strong>Chrome or Edge</strong> — Settings → Privacy and security →
              Site settings → JavaScript → <em>Sites can use JavaScript</em>.</li>
            <li><strong>Safari</strong> — Settings → Advanced → Show features for web
              developers, then Developer → <em>Enable JavaScript</em>.</li>
          </ul>
          <p>
            If JavaScript is already on, a content blocker such as NoScript,
            uBlock Origin or Brave Shields may be blocking scripts for this
            host. Allow it in the extension, then reload.
          </p>
          <p class="noscript-footer">Minbar Management Console</p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
