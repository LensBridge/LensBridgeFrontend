name: CI

# The API layer in src/api is generated from LensBridgeBackend/openapi.yaml. This
# job checks the generated client still matches the backend's committed contract,
# so a server-side rename fails here rather than at runtime in the browser.

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: LensBridgeFrontend

      # The contract to check against is the backend branch matching this one:
      # a PR's base branch, or the pushed branch. Backend develop runs ahead of
      # master, so checking a develop PR against master fails on every new
      # endpoint. A branch the backend does not have falls back to master.
      - name: Pick the backend branch
        id: backend
        env:
          WANTED: ${{ github.base_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/LensBridge/LensBridgeBackend.git "refs/heads/$WANTED" > /dev/null; then
            ref="$WANTED"
          else
            ref=master
          fi
          echo "Checking against LensBridgeBackend@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the backend for its OpenAPI contract
        uses: actions/checkout@v4
        with:
          repository: LensBridge/LensBridgeBackend
          ref: ${{ steps.backend.outputs.ref }}
          path: LensBridgeBackend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: LensBridgeFrontend/package-lock.json

      - run: npm ci
        working-directory: LensBridgeFrontend

      - name: Fail if the generated client is stale
        working-directory: LensBridgeFrontend
        env:
          OPENAPI_SPEC: ${{ github.workspace }}/LensBridgeBackend/openapi.yaml
        run: npm run api:check

      - name: Type-check the API layer
        working-directory: LensBridgeFrontend
        run: npm run typecheck

      - name: Token refresh tests
        # Covers the single-flight refresh: concurrent 401s must trigger exactly
        # one refresh, or the refresh token rotates twice and logs the user out.
        working-directory: LensBridgeFrontend
        run: npm test

      - run: npm run lint
        working-directory: LensBridgeFrontend
        continue-on-error: true

      - run: npx vite build
        working-directory: LensBridgeFrontend
